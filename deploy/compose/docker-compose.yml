# CodeAtlas evaluation stack. Copy .env.example to .env and set the secrets first:
#   docker compose --env-file .env up -d --build
name: codeatlas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codeatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: codeatlas
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeatlas -d codeatlas"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: codeatlas
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      CODEATLAS_DATABASE_URL: postgres://codeatlas:${POSTGRES_PASSWORD}@postgres:5432/codeatlas?sslmode=disable
      CODEATLAS_CLICKHOUSE_URL: http://clickhouse:8123
      CODEATLAS_CLICKHOUSE_USER: codeatlas
      CODEATLAS_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CODEATLAS_ADMIN_EMAIL: ${CODEATLAS_ADMIN_EMAIL:?set CODEATLAS_ADMIN_EMAIL in .env}
      CODEATLAS_ADMIN_PASSWORD: ${CODEATLAS_ADMIN_PASSWORD:?set CODEATLAS_ADMIN_PASSWORD in .env}
      CODEATLAS_COOKIE_SECURE: ${CODEATLAS_COOKIE_SECURE:-false}
    ports:
      - "${CODEATLAS_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  clickhouse-data:
